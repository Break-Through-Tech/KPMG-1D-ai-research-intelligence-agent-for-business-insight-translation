server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # localhost often carries big cookies from other dev apps; the default 8k limit rejects them.
    large_client_header_buffers 4 64k;

    # /api/* -> FastAPI backend, with the /api prefix removed (same as the Vite dev proxy).
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        # Retrieving and storing papers can take several minutes.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Client-side routes (/database, ...) all load the React app.
    location / {
        try_files $uri /index.html;
    }
}
