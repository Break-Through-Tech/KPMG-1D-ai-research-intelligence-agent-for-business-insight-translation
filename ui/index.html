<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KPMG · AI Research Intelligence</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="header">
    <div class="header-inner">
      <a class="brand" href="#">
        <img class="logo" src="kpmg-logo.png" alt="KPMG">
        <span class="divider" aria-hidden="true"></span>
        <span class="product">AI Research Intelligence</span>
      </a>
      <nav class="nav">
        <a href="#how" class="nav-link">How it works</a>
        <a href="functionality.html" class="nav-link">Functionality</a>
        <a href="database.html" class="nav-link">Database Monitor</a>
        <label for="q" class="btn btn-header">Try a question</label>
      </nav>
    </div>
  </header>

  <main class="hero">

    <section class="hero-copy">
      <p class="eyebrow">AI research for business teams</p>
      <h1>Ask KAI about AI research</h1>
      <p class="lede">
        Ask a question about recent AI research. Get a cited summary.
      </p>

      <!-- Main composer: the first thing users see -->
      <form class="composer" id="ask" action="#" onsubmit="return false">
        <label for="q" class="sr-only">Your question</label>
        <textarea id="q" rows="2" autofocus
                  placeholder="Ask anything about recent AI research…"></textarea>
        <div class="composer-bar">
          <div class="context-field">
            <label for="ctx">Why are you asking? <span class="optional">Optional</span></label>
            <input id="ctx" type="text"
                   placeholder="e.g. Preparing a client briefing for a bank that wants to use AI agents">
          </div>
          <button type="submit" class="send" aria-label="Ask KAI">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor"
                    stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </form>
    </section>

    <div class="panel">

    <!-- KAI mascot: shown by default, hidden while "How it works" is open -->
    <section class="mascot" aria-label="KAI, the research assistant">
      <div class="mascot-stage">
        <svg class="kai" viewBox="0 0 480 500" role="img" aria-labelledby="kai-title">
          <title id="kai-title">KAI, a geometric owl research assistant wearing reading glasses</title>
          <defs>
            <radialGradient id="halo" cx=".5" cy=".5" r=".5">
              <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
              <stop offset=".7" stop-color="#ffffff" stop-opacity=".06"/>
              <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="owl-body" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#3a63ff"/>
              <stop offset=".55" stop-color="#1e49e2"/>
              <stop offset="1" stop-color="#00338d"/>
            </linearGradient>
            <linearGradient id="owl-wing" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#8b3cf5"/>
              <stop offset="1" stop-color="#5a12c4"/>
            </linearGradient>
            <linearGradient id="owl-belly" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff"/>
              <stop offset="1" stop-color="#dfe5ff"/>
            </linearGradient>
            <linearGradient id="hl-line" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#00b8f5"/>
              <stop offset="1" stop-color="#7213ea"/>
            </linearGradient>
          </defs>

          <!-- Soft halo -->
          <circle cx="240" cy="270" r="215" fill="url(#halo)"/>
          <circle cx="240" cy="270" r="190" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.5" stroke-dasharray="2 10" stroke-linecap="round"/>

          <!-- Sparkles -->
          <g fill="#ffffff">
            <path d="M92 150 l5 13 13 5 -13 5 -5 13 -5 -13 -13 -5 13 -5z" opacity=".9"/>
            <path d="M392 118 l3.5 9 9 3.5 -9 3.5 -3.5 9 -3.5 -9 -9 -3.5 9 -3.5z" fill="#00b8f5"/>
            <path d="M410 300 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" opacity=".7"/>
            <circle cx="120" cy="330" r="3" opacity=".6"/>
            <circle cx="360" cy="190" r="2.5" opacity=".7"/>
          </g>

          <!-- Stack of research pages -->
          <g stroke-linejoin="round">
            <path d="M240 415 L370 460 L240 505 L110 460 Z" fill="#b7c1f4"/>
            <path d="M240 405 L370 450 L240 495 L110 450 Z" fill="#d3d9fa" stroke="#b7c1f4"/>
            <path d="M240 395 L370 440 L240 485 L110 440 Z" fill="#ffffff" stroke="#c9d0f3"/>
            <g stroke-width="4" stroke-linecap="round">
              <line x1="292" y1="425" x2="330" y2="438" stroke="#d2d7ea"/>
              <line x1="300" y1="437" x2="336" y2="449" stroke="url(#hl-line)"/>
              <line x1="150" y1="440" x2="178" y2="430" stroke="#d2d7ea"/>
              <line x1="158" y1="452" x2="196" y2="439" stroke="#d2d7ea"/>
            </g>
          </g>
          <ellipse cx="240" cy="440" rx="74" ry="13" fill="#0c233c" opacity=".16"/>

          <g transform="translate(0 12)">
            <!-- Ear tufts -->
            <path d="M172 190 L150 118 L218 166 Z" fill="#1e49e2"/>
            <path d="M308 190 L330 118 L262 166 Z" fill="#1e49e2"/>

            <!-- Body -->
            <path d="M240 150 C 322 150, 348 232, 348 302 C 348 372, 302 422, 240 422 C 178 422, 132 372, 132 302 C 132 232, 158 150, 240 150 Z" fill="url(#owl-body)"/>

            <!-- Belly with feather chevrons -->
            <ellipse cx="240" cy="352" rx="74" ry="66" fill="url(#owl-belly)"/>
            <g fill="none" stroke="#b9c4f6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M212 372 l10 8 10 -8"/>
              <path d="M248 372 l10 8 10 -8"/>
              <path d="M230 392 l10 8 10 -8"/>
            </g>

            <!-- Name tag -->
            <rect x="210" y="326" width="60" height="26" rx="13" fill="#1e49e2"/>
            <text x="240" y="344.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2" fill="#ffffff">KAI</text>

            <!-- Left wing (resting) -->
            <path d="M136 268 C 104 300, 108 362, 152 398 C 160 352, 166 312, 162 280 Z" fill="url(#owl-wing)"/>

            <!-- Right wing (raised, holding a page) -->
            <path d="M342 266 C 384 272, 410 312, 404 346 C 380 338, 356 318, 338 296 Z" fill="url(#owl-wing)"/>
            <g transform="translate(-14 4) rotate(14 412 330)">
              <rect x="386" y="290" width="54" height="68" rx="6" fill="#ffffff" stroke="#c9d0f3" stroke-width="2"/>
              <rect x="395" y="303" width="36" height="5" rx="2.5" fill="#d2d7ea"/>
              <rect x="395" y="315" width="28" height="5" rx="2.5" fill="#d2d7ea"/>
              <rect x="395" y="327" width="36" height="5" rx="2.5" fill="url(#hl-line)"/>
              <rect x="395" y="339" width="22" height="5" rx="2.5" fill="#d2d7ea"/>
            </g>

            <!-- Face discs -->
            <circle cx="194" cy="236" r="44" fill="#ffffff"/>
            <circle cx="286" cy="236" r="44" fill="#ffffff"/>

            <!-- Eyes -->
            <circle cx="198" cy="238" r="24" fill="#00b8f5"/>
            <circle cx="282" cy="238" r="24" fill="#00b8f5"/>
            <circle cx="200" cy="240" r="15" fill="#0c233c"/>
            <circle cx="280" cy="240" r="15" fill="#0c233c"/>
            <circle cx="206" cy="232" r="5.5" fill="#ffffff"/>
            <circle cx="286" cy="232" r="5.5" fill="#ffffff"/>

            <!-- Reading glasses -->
            <g fill="none" stroke="#0c233c" stroke-width="5">
              <circle cx="194" cy="236" r="44"/>
              <circle cx="286" cy="236" r="44"/>
              <path d="M150 226 L134 216" stroke-linecap="round"/>
              <path d="M330 226 L346 216" stroke-linecap="round"/>
            </g>

            <!-- Beak -->
            <path d="M240 266 L252 280 L240 298 L228 280 Z" fill="#00b8f5" stroke="#0c233c" stroke-width="2" stroke-linejoin="round"/>

            <!-- Feet -->
            <ellipse cx="216" cy="424" rx="14" ry="7" fill="#00b8f5"/>
            <ellipse cx="264" cy="424" rx="14" ry="7" fill="#00b8f5"/>
          </g>
        </svg>

        <div class="bubble">
          <strong>Hi, I'm KAI.</strong>
          Ask me about recent AI research, I'm an expert!!
        </div>
      </div>
    </section>

    <section class="diagram" id="how" aria-label="How it works">
      <div class="diagram-top">
        <p class="diagram-caption">How KAI answers your question</p>
        <a href="#" class="close-link">Close</a>
      </div>

      <div class="diagram-body">
        <svg class="flow" viewBox="0 0 760 540" role="img" aria-labelledby="flow-title">
          <title id="flow-title">KAI collects AI papers from arXiv, processes them into a database, and answers a KPMG employee's question with cited passages from that database.</title>
          <defs>
            <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="#ffffff"/>
            </marker>
            <marker id="arw-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0 0 L10 5 L0 10 z" fill="#00b8f5"/>
            </marker>
          </defs>

          <text class="lane" x="10" y="36">BEHIND THE SCENES</text>
          <text class="lane" x="10" y="356">WHEN YOU ASK</text>

          <!-- Top row: arXiv -> Processing -> Database -->
          <g class="arrow">
            <line x1="202" y1="131" x2="281" y2="131" marker-end="url(#arw)"/>
            <line x1="477" y1="131" x2="556" y2="131" marker-end="url(#arw)"/>
          </g>
          <text class="arrow-label" x="242" y="121">collect</text>
          <text class="arrow-label" x="517" y="121">store</text>

          <g class="card">
            <rect x="10" y="56" width="190" height="150" rx="14"/>
            <circle class="icon-bg" cx="105" cy="104" r="30"/>
            <rect x="87" y="84" width="26" height="34" rx="3" fill="#c9d0f3"/>
            <rect x="97" y="90" width="26" height="34" rx="3" fill="#fff" stroke="#1e49e2" stroke-width="1.5"/>
            <rect x="102" y="98" width="16" height="3" rx="1.5" fill="#c9d0f3"/>
            <rect x="102" y="105" width="12" height="3" rx="1.5" fill="#c9d0f3"/>
            <rect x="102" y="112" width="16" height="3" rx="1.5" fill="#1e49e2"/>
            <text class="card-title" x="105" y="158">arXiv AI papers</text>
            <text class="card-sub" x="105" y="178">Newest research from</text>
            <text class="card-sub" x="105" y="194">the AI section (cs.AI)</text>
          </g>

          <g class="card">
            <rect x="285" y="56" width="190" height="150" rx="14"/>
            <circle class="icon-bg" cx="380" cy="104" r="30"/>
            <rect x="356" y="88" width="20" height="30" rx="3" fill="#fff" stroke="#1e49e2" stroke-width="1.5"/>
            <path d="M380 103 h8 m-3 -3 l3 3 -3 3" fill="none" stroke="#1e49e2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="392" y="90" width="18" height="6" rx="3" fill="#c9d0f3"/>
            <rect x="392" y="100" width="18" height="6" rx="3" fill="#00b8f5"/>
            <rect x="392" y="110" width="18" height="6" rx="3" fill="#c9d0f3"/>
            <text class="card-title" x="380" y="158">Processing</text>
            <text class="card-sub" x="380" y="178">Papers are read and</text>
            <text class="card-sub" x="380" y="194">split into short passages</text>
          </g>

          <g class="card">
            <rect x="560" y="56" width="190" height="150" rx="14"/>
            <circle class="icon-bg" cx="655" cy="104" r="30"/>
            <path d="M635 92 v24 a20 7 0 0 0 40 0 v-24" fill="#1e49e2"/>
            <path d="M635 104 a20 7 0 0 0 40 0" fill="none" stroke="#7d9bff" stroke-width="1.5"/>
            <ellipse cx="655" cy="92" rx="20" ry="7" fill="#5b7fff"/>
            <text class="card-title" x="655" y="158">Database</text>
            <text class="card-sub" x="655" y="178">Passages saved with</text>
            <text class="card-sub" x="655" y="194">their paper and page</text>
          </g>

          <!-- KAI searches the database -->
          <g class="arrow">
            <line x1="655" y1="210" x2="655" y2="372" marker-start="url(#arw)" marker-end="url(#arw)"/>
          </g>
          <text class="arrow-label end" x="643" y="286">KAI searches</text>
          <text class="arrow-label end" x="643" y="302">the database</text>

          <!-- Bottom row: employee asks, KAI answers -->
          <g class="arrow">
            <line x1="202" y1="426" x2="556" y2="426" marker-end="url(#arw)"/>
          </g>
          <g class="arrow answer">
            <line x1="558" y1="478" x2="204" y2="478" marker-end="url(#arw-c)"/>
          </g>

          <rect class="pill" x="210" y="390" width="340" height="28" rx="14"/>
          <text class="pill-text" x="380" y="408">&#8220;What are the risks of deploying AI agents?&#8221;</text>

          <rect class="pill pill-answer" x="262" y="486" width="236" height="28" rx="14"/>
          <text class="pill-text" x="380" y="504">Cited answer &#183; sources [1] [2]</text>

          <g class="card">
            <rect x="10" y="376" width="190" height="150" rx="14"/>
            <circle class="icon-bg" cx="105" cy="424" r="30"/>
            <circle cx="105" cy="414" r="10" fill="#1e49e2"/>
            <path d="M84 446 c0 -18 42 -18 42 0 z" fill="#1e49e2"/>
            <rect x="109" y="433" width="10" height="7" rx="1.5" fill="#00b8f5"/>
            <text class="card-title" x="105" y="478">KPMG employee</text>
            <text class="card-sub" x="105" y="498">Asks a question in</text>
            <text class="card-sub" x="105" y="514">plain language</text>
          </g>

          <g class="card">
            <rect x="560" y="376" width="190" height="150" rx="14"/>
            <circle class="icon-bg" cx="655" cy="424" r="30"/>
            <path d="M639 412 l-4 -16 13 9 z M671 412 l4 -16 -13 9 z" fill="#1e49e2"/>
            <circle cx="655" cy="424" r="20" fill="#1e49e2"/>
            <circle cx="647" cy="420" r="7.5" fill="#fff" stroke="#0c233c" stroke-width="2"/>
            <circle cx="663" cy="420" r="7.5" fill="#fff" stroke="#0c233c" stroke-width="2"/>
            <circle cx="648" cy="421" r="3.5" fill="#0c233c"/>
            <circle cx="662" cy="421" r="3.5" fill="#0c233c"/>
            <path d="M655 428 l3 4 -3 4 -3 -4 z" fill="#00b8f5"/>
            <text class="card-title" x="655" y="478">KAI agent</text>
            <text class="card-sub" x="655" y="498">Reads the best passages</text>
            <text class="card-sub" x="655" y="514">and writes the answer</text>
          </g>
        </svg>
      </div>
    </section>

    </div>

  </main>

</body>
</html>
